<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fluxo da Semana">
<title>Fluxo da Semana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121212; --card: #1E1E1E; --field: #262626; --line: #333333;
    --text: #E3E3E3; --muted: #9A9A9A;
    --accent: #8AB4F8; --accent-ink: #0F1A2E; --done: #81C995;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    padding-bottom: calc(112px + var(--sab));
  }
  body.locked { overflow: hidden; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Barra superior fixa: título, nome e menu */
  .top {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding-top: calc(10px + var(--sat));
  }
  .top-in { display: flex; align-items: center; gap: 12px; }
  .brand { flex: 1; min-width: 0; }
  h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; }
  .who {
    display: block; max-width: 100%; background: none; border: 0; padding: 4px 0;
    color: var(--muted); font-size: .85rem; text-align: left;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .who.set { color: var(--accent); font-weight: 600; }
  .menu-btn {
    width: 48px; height: 48px; flex: none; border-radius: 12px;
    background: var(--card); border: 1px solid var(--line);
    display: grid; place-items: center;
  }
  .menu-btn svg { width: 22px; height: 22px; stroke: var(--text); stroke-width: 2.2; fill: none; stroke-linecap: round; }
  .reset {
    min-height: 52px; width: 100%; border: 0; border-radius: 12px; padding: 14px 20px;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1rem;
    transition: transform .15s ease, filter .15s ease;
  }
  .reset:active { transform: scale(.98); filter: brightness(.95); }
  .reset-top { display: none; width: auto; min-height: 48px; }

  .meter { display: flex; align-items: center; gap: 10px; padding-top: 8px; padding-bottom: 10px; font-size: .82rem; color: var(--muted); }
  .meter strong { color: var(--text); font-weight: 600; white-space: nowrap; }
  .bar { flex: 1; height: 6px; background: var(--card); border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--done); border-radius: 99px; transition: width .4s ease; }

  /* Cartões */
  .grid { display: grid; gap: 14px; grid-template-columns: 1fr; padding-top: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; display: flex; flex-direction: column; gap: 14px;
    scroll-margin-top: 110px; transition: border-color .25s ease, background-color .25s ease;
  }
  .card.done { background: color-mix(in srgb, var(--done) 20%, var(--card)); border-color: var(--done); }
  .card.done input[type="date"], .card.done input[type="time"], .card.done textarea {
    background: color-mix(in srgb, var(--done) 14%, var(--field));
    border-color: color-mix(in srgb, var(--done) 45%, var(--line));
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .card h2 { font-size: 1.2rem; font-weight: 600; letter-spacing: -0.01em; }
  .card.done h2 { color: var(--done); }

  .check { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; min-height: 48px; padding: 0 4px 0 12px; margin-right: -4px; font-size: .9rem; color: var(--muted); touch-action: manipulation; }
  .check input { position: absolute; opacity: 0; width: 0; height: 0; }
  .box { width: 32px; height: 32px; border-radius: 9px; border: 2px solid #5a5a5a; display: grid; place-items: center; transition: background .2s ease, border-color .2s ease; }
  .box svg { width: 18px; height: 18px; stroke: var(--bg); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity .15s ease; }
  .check input:checked + .box { background: var(--done); border-color: var(--done); }
  .check input:checked + .box svg { opacity: 1; }
  .check input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 3px; }

  .row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px; }
  label.f { display: flex; flex-direction: column; gap: 6px; font-size: .82rem; color: var(--muted); min-width: 0; }
  input[type="date"], input[type="time"], input[type="text"], textarea {
    width: 100%; min-width: 0; background: var(--field); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px;
    font: inherit; font-size: 16px; -webkit-appearance: none; appearance: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input[type="date"], input[type="time"], input[type="text"] { min-height: 48px; }
  input[type="date"]::-webkit-calendar-picker-indicator, input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(.8); }
  textarea { min-height: 140px; resize: none; line-height: 1.55; overflow: hidden; }
  ::placeholder { color: #6b6b6b; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }

  /* Menu inferior: dias da semana ao alcance do polegar */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: color-mix(in srgb, var(--card) 94%, transparent);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
    padding: 8px 8px calc(8px + var(--sab));
  }
  .tabs-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .tab {
    min-height: 54px; border-radius: 12px; border: 1px solid transparent; background: transparent;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    font-size: .82rem; font-weight: 600; color: var(--muted);
    transition: background .2s ease, color .2s ease, border-color .2s ease;
  }
  .tab .m { height: 14px; font-size: .75rem; line-height: 14px; }
  .tab.today:not(.done) .m::before { content: "•"; color: var(--accent); }
  .tab.done { color: var(--done); }
  .tab.done .m::before { content: "✓"; }
  .tab.active { background: var(--field); border-color: var(--line); color: var(--text); }
  .tab.active.done { color: var(--done); border-color: color-mix(in srgb, var(--done) 60%, var(--line)); }

  /* Menu (painel que sobe de baixo) */
  .overlay { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility .25s; }
  .overlay.open { opacity: 1; visibility: visible; }
  .sheet {
    position: fixed; left: 50%; bottom: 0; z-index: 50; width: 100%; max-width: 520px;
    background: var(--card); border: 1px solid var(--line); border-bottom: 0;
    border-radius: 20px 20px 0 0; padding: 10px 20px calc(24px + var(--sab));
    transform: translate(-50%, 100%); visibility: hidden;
    transition: transform .3s ease, visibility .3s;
    max-height: 90vh; overflow-y: auto;
  }
  .sheet.open { transform: translate(-50%, 0); visibility: visible; }
  .grab { width: 40px; height: 4px; border-radius: 99px; background: var(--line); margin: 0 auto 10px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .sheet-head h2 { font-size: 1.2rem; font-weight: 700; }
  .close { width: 48px; height: 48px; margin-right: -10px; background: none; border: 0; border-radius: 12px; font-size: 1.4rem; color: var(--muted); }
  .sheet .f { margin-bottom: 20px; }
  .note { margin-top: 12px; font-size: .82rem; color: var(--muted); text-align: center; }

  #cOverlay { z-index: 70; }
  .confirm {
    position: fixed; left: 50%; top: 50%; z-index: 80; width: calc(100% - 32px); max-width: 400px;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px;
    transform: translate(-50%, -46%); opacity: 0; visibility: hidden;
    transition: transform .25s ease, opacity .25s ease, visibility .25s;
  }
  .confirm.open { transform: translate(-50%, -50%); opacity: 1; visibility: visible; }
  .confirm h2 { font-size: 1.15rem; font-weight: 700; }
  .confirm p { color: var(--muted); font-size: .92rem; margin: 8px 0 20px; }
  .c-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .c-actions button { min-height: 52px; border-radius: 12px; font-weight: 700; border: 1px solid var(--line); }
  .btn-sec { background: var(--field); }
  .btn-danger { background: #F28B82; color: #2B0F0D; border-color: #F28B82 !important; }

  .status {
    position: fixed; left: 50%; z-index: 60; bottom: calc(92px + var(--sab));
    background: var(--card); border: 1px solid var(--line); color: var(--muted);
    font-size: .85rem; padding: 9px 16px; border-radius: 99px;
    width: max-content; max-width: calc(100% - 32px); text-align: center;
    opacity: 0; transform: translate(-50%, 6px); transition: opacity .25s ease, transform .25s ease; pointer-events: none;
  }
  .status.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 360px) {
    .row { grid-template-columns: 1fr; }
    .tab { font-size: .75rem; }
  }
  @media (min-width: 700px) {
    .wrap { padding: 0 24px; }
    h1 { font-size: 1.5rem; }
    .reset-top { display: block; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; padding-top: 24px; }
    .card { padding: 20px; }
    .sheet { bottom: 50%; border-radius: 20px; border-bottom: 1px solid var(--line); transform: translate(-50%, 60%); padding-bottom: 24px; }
    .sheet.open { transform: translate(-50%, 50%); }
    .grab { display: none; }
  }
  @media (hover: hover) {
    .reset:hover { filter: brightness(1.08); }
    .tab:hover, .menu-btn:hover { border-color: var(--accent); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <h1>📅 Fluxo da Semana</h1>
      <button class="who" id="who" type="button">Toque para colocar seu nome</button>
    </div>
    <button class="reset reset-top" id="resetTop" type="button">🔄 Resetar e Planejar Próximo Ciclo</button>
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Abrir menu" aria-haspopup="dialog" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
  <div class="wrap meter" aria-live="polite">
    <strong id="count">0 de 7</strong>
    <div class="bar"><span id="fill"></span></div>
  </div>
</header>

<div class="wrap"><main class="grid" id="grid"></main></div>

<nav class="tabs" aria-label="Ir para o dia">
  <div class="tabs-in" id="tabs"></div>
</nav>

<div class="overlay" id="overlay"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="grab"></div>
  <div class="sheet-head">
    <h2 id="sheetTitle">Menu</h2>
    <button class="close" id="close" type="button" aria-label="Fechar menu">✕</button>
  </div>
  <label class="f">Nome no bloco de notas
    <input type="text" id="owner" maxlength="40" placeholder="Digite seu nome" autocomplete="name" enterkeyhint="done">
  </label>
  <button class="reset" id="resetSheet" type="button">🔄 Resetar e Planejar Próximo Ciclo</button>
  <p class="note">Limpa checkboxes, anotações, datas e horas. Seu nome é mantido. Tudo é salvo automaticamente neste aparelho.</p>
</section>

<div class="overlay" id="cOverlay"></div>
<section class="confirm" id="confirm" role="alertdialog" aria-modal="true" aria-labelledby="cTitle" aria-describedby="cText" aria-hidden="true">
  <h2 id="cTitle">Deseja mesmo resetar?</h2>
  <p id="cText">Isso limpa todo o planejamento: anotações, datas, horas e dias concluídos. Seu nome será mantido.</p>
  <div class="c-actions">
    <button class="btn-sec" id="cNo" type="button">Cancelar</button>
    <button class="btn-danger" id="cYes" type="button">Sim, resetar</button>
  </div>
</section>

<div class="status" id="status" role="status">Salvo</div>

<script>
(function () {
  var DAYS = [
    { id: "seg", name: "Segunda-feira", short: "Seg" },
    { id: "ter", name: "Terça-feira", short: "Ter" },
    { id: "qua", name: "Quarta-feira", short: "Qua" },
    { id: "qui", name: "Quinta-feira", short: "Qui" },
    { id: "sex", name: "Sexta-feira", short: "Sex" },
    { id: "sab", name: "Sábado", short: "Sáb" },
    { id: "dom", name: "Domingo", short: "Dom" }
  ];
  var KEY = "fluxo-semana-aoi-v1";
  var OWNER_KEY = "fluxo-semana-nome-v1";
  var BASE_TITLE = "Fluxo da Semana";
  var TODAY = ["dom", "seg", "ter", "qua", "qui", "sex", "sab"][new Date().getDay()];

  var $ = function (id) { return document.getElementById(id); };
  var grid = $("grid"), tabs = $("tabs"), statusEl = $("status");
  var sheet = $("sheet"), overlay = $("overlay"), menuBtn = $("menuBtn");
  var ownerEl = $("owner"), whoEl = $("who");
  var data = load();
  var saveTimer, statusTimer;

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
    catch (e) { return {}; }
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); flash("Salvo"); }
    catch (e) { flash("Não foi possível salvar"); }
  }
  function flash(msg, ms) {
    statusEl.textContent = msg;
    statusEl.classList.add("show");
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function () { statusEl.classList.remove("show"); }, ms || 1200);
  }
  function entry(id) {
    if (!data[id]) data[id] = { date: "", time: "", note: "", done: false };
    return data[id];
  }
  function grow(el) {
    el.style.height = "auto";
    el.style.height = Math.max(el.scrollHeight + 2, 140) + "px";
  }

  /* Cartões e abas */
  DAYS.forEach(function (d) {
    var card = document.createElement("article");
    card.className = "card";
    card.id = "dia-" + d.id;
    card.dataset.id = d.id;
    card.innerHTML =
      '<div class="card-head">' +
        '<h2>' + d.name + '</h2>' +
        '<label class="check"><span>Concluído</span>' +
          '<input type="checkbox" data-f="done">' +
          '<span class="box"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></span>' +
        '</label>' +
      '</div>' +
      '<div class="row">' +
        '<label class="f">Data<input type="date" data-f="date"></label>' +
        '<label class="f">Hora<input type="time" data-f="time"></label>' +
      '</div>' +
      '<label class="f">Anotações' +
        '<textarea data-f="note" placeholder="Roteiro, ideias, títulos, o que fazer neste dia…"></textarea>' +
      '</label>';
    grid.appendChild(card);

    var tab = document.createElement("button");
    tab.type = "button";
    tab.className = "tab" + (d.id === TODAY ? " today" : "");
    tab.dataset.id = d.id;
    tab.innerHTML = '<span>' + d.short + '</span><span class="m"></span>';
    tab.setAttribute("aria-label", "Ir para " + d.name);
    tab.addEventListener("click", function () {
      setActive(d.id);
      card.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    tabs.appendChild(tab);
  });

  function setActive(id) {
    tabs.querySelectorAll(".tab").forEach(function (t) {
      var on = t.dataset.id === id;
      t.classList.toggle("active", on);
      if (on) t.setAttribute("aria-current", "true"); else t.removeAttribute("aria-current");
    });
  }
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (list) {
      list.forEach(function (en) { if (en.isIntersecting) setActive(en.target.dataset.id); });
    }, { rootMargin: "-25% 0px -65% 0px" });
    grid.querySelectorAll(".card").forEach(function (c) { io.observe(c); });
  }

  function sync(id) {
    var done = entry(id).done;
    $("dia-" + id).classList.toggle("done", done);
    tabs.querySelector('[data-id="' + id + '"]').classList.toggle("done", done);
  }
  function updateProgress() {
    var n = DAYS.filter(function (d) { return entry(d.id).done; }).length;
    $("count").textContent = n + " de " + DAYS.length;
    $("fill").style.width = (n / DAYS.length * 100) + "%";
  }
  function fill() {
    grid.querySelectorAll(".card").forEach(function (card) {
      var v = entry(card.dataset.id);
      card.querySelector('[data-f="date"]').value = v.date;
      card.querySelector('[data-f="time"]').value = v.time;
      var ta = card.querySelector('[data-f="note"]');
      ta.value = v.note;
      grow(ta);
      card.querySelector('[data-f="done"]').checked = v.done;
      sync(card.dataset.id);
    });
    updateProgress();
  }

  function onChange(e) {
    var el = e.target, f = el.dataset.f;
    if (!f) return;
    var id = el.closest(".card").dataset.id;
    var v = entry(id);
    if (f === "done") {
      v.done = el.checked;
      sync(id);
      updateProgress();
    } else {
      v[f] = el.value;
      if (f === "note") grow(el);
    }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, f === "note" ? 250 : 0);
  }
  grid.addEventListener("input", onChange);
  grid.addEventListener("change", onChange);
  window.addEventListener("resize", function () { grid.querySelectorAll("textarea").forEach(grow); });

  /* Menu */
  function openMenu() {
    sheet.classList.add("open");
    overlay.classList.add("open");
    sheet.setAttribute("aria-hidden", "false");
    menuBtn.setAttribute("aria-expanded", "true");
    document.body.classList.add("locked");
    setTimeout(function () { (ownerEl.value ? $("close") : ownerEl).focus(); }, 320);
  }
  function closeMenu() {
    if (!sheet.classList.contains("open")) return;
    sheet.classList.remove("open");
    overlay.classList.remove("open");
    sheet.setAttribute("aria-hidden", "true");
    menuBtn.setAttribute("aria-expanded", "false");
    document.body.classList.remove("locked");
    if (document.activeElement) document.activeElement.blur();
  }
  menuBtn.addEventListener("click", openMenu);
  whoEl.addEventListener("click", openMenu);
  $("close").addEventListener("click", closeMenu);
  overlay.addEventListener("click", closeMenu);
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if ($("confirm").classList.contains("open")) closeConfirm(); else closeMenu();
  });
  ownerEl.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); closeMenu(); } });

  /* Nome do usuário (chave separada: o reset não apaga) */
  function applyOwner() {
    var n = ownerEl.value.trim();
    document.title = n ? BASE_TITLE + " – " + n : BASE_TITLE;
    whoEl.textContent = n ? "Bloco de notas de " + n : "Toque para colocar seu nome";
    whoEl.classList.toggle("set", !!n);
  }
  try { ownerEl.value = localStorage.getItem(OWNER_KEY) || ""; } catch (e) {}
  applyOwner();
  ownerEl.addEventListener("input", function () {
    applyOwner();
    try { localStorage.setItem(OWNER_KEY, ownerEl.value); flash("Salvo"); }
    catch (e) { flash("Não foi possível salvar"); }
  });

  /* Reset geral (confirmação própria: o confirm() nativo é bloqueado em alguns navegadores) */
  var cBox = $("confirm"), cOverlay = $("cOverlay");
  function openConfirm() {
    cBox.classList.add("open");
    cOverlay.classList.add("open");
    cBox.setAttribute("aria-hidden", "false");
    document.body.classList.add("locked");
    setTimeout(function () { $("cNo").focus(); }, 60);
  }
  function closeConfirm() {
    cBox.classList.remove("open");
    cOverlay.classList.remove("open");
    cBox.setAttribute("aria-hidden", "true");
    if (!sheet.classList.contains("open")) document.body.classList.remove("locked");
  }
  function doReset() {
    data = {};
    try { localStorage.removeItem(KEY); } catch (e) {}
    fill();
    closeConfirm();
    closeMenu();
    flash("Fluxo resetado com sucesso! Pronto para o próximo ciclo.", 3000);
    window.scrollTo({ top: 0 });
  }
  $("resetTop").addEventListener("click", openConfirm);
  $("resetSheet").addEventListener("click", openConfirm);
  $("cNo").addEventListener("click", closeConfirm);
  cOverlay.addEventListener("click", closeConfirm);
  $("cYes").addEventListener("click", doReset);

  fill();
})();
</script>
</body>
</html>
